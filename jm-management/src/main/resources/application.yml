spring:
  application:
    name: jm-management
  datasource:
    url: jdbc:mysql://localhost:3306/cpjm-parent
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: java422-web-ai
    region: cn-beijing

clue:
  recycle:
    # 超过多少天未跟进，自动回收到线索池
    threshold-days: 7
    # 执行时间：每天凌晨 2 点
    cron: 0 0 2 * * ?