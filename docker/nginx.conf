# 学途管家前端 nginx 配置（容器版）
# 与本机 nginx 配置一致，仅两处调整：
#   1. root 改为容器内绝对路径
#   2. /api 反代目标由 localhost:8080 改为 compose 服务名 app:8080

server {
    listen       90;
    server_name  localhost;
    client_max_body_size 10m;

    # 前端静态资源（Vue 打包产物，history 路由回退到 index.html）
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }

    # 后端接口反向代理：去掉 /api 前缀转发给后端服务
    location /api {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://app:8080;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
