# ============================================================
# 学途管家一键部署编排：前端(nginx) + 后端(app) + MySQL 8 + Redis 7
# 启动：docker compose up -d --build
# 访问：http://localhost:90 （前端页面，/api 自动反代后端 8080）
# ============================================================
services:

  mysql:
    image: mysql:8.0
    container_name: jm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: cpjm-parent
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库建表 + 初始化数据
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"          # 宿主机 3307 -> 容器 3306，避免与本机 MySQL 冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: jm-redis
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"          # 宿主机 6380 -> 容器 6379，避免与本机 Redis 冲突
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: jm-app
    environment:
      TZ: Asia/Shanghai
      # 容器内通过服务名访问 mysql / redis（覆盖 application.yml 中的 localhost）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cpjm-parent?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.24
    container_name: jm-nginx
    volumes:
      - ./front-dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    ports:
      - "90:90"

volumes:
  mysql-data:
  redis-data:
